name: Monitor README Updates and Send Email

on:
  schedule:
    # 每天 UTC 时间 0:00（北京时间早上 8:00）运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 界面手动触发测试

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. 拉取当前仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 批量拉取多目标，对比 Hash 并生成合并邮件内容
      - name: Fetch and Check Multiple URLs
        id: process_urls
        run: |
          mkdir -p data
          
          # ========================================================
          # 💡 未来需要新增监控地址时，只需要在下面 URLS 数组中添加即可！
          # 注意：GitHub 文件的 raw 地址格式为：https://raw.githubusercontent.com/用户名/仓库名/分支/文件路径
          # ========================================================
          URLS=(
            "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/README.md"
            "https://raw.githubusercontent.com/cbusifabcap/daily_free_vpn/main/README.md"
          )

          HAS_UPDATES="false"
          EMAIL_BODY_FILE="data/email_body.html"
          rm -f $EMAIL_BODY_FILE

          # 初始化邮件 HTML 样式开头
          echo "<html><body>" > $EMAIL_BODY_FILE
          echo "<h2>📢 GitHub 监控 README 更新提醒</h2>" >> $EMAIL_BODY_FILE
          echo "<p>检查时间：$(date)</p>" >> $EMAIL_BODY_FILE

          # 遍历所有配置的 URL
          for raw_url in "${URLS[@]}"; do
            # 生成安全的本地文件名和 Hash 保存文件名（基于 URL 计算 md5 命名，防止重名）
            URL_KEY=$(echo -n "$raw_url" | md5sum | awk '{print $1}')
            TEMP_FILE="data/temp_${URL_KEY}.md"
            HASH_FILE="data/hash_${URL_KEY}.txt"

            echo "正在检查: $raw_url"
            curl -sSL "$raw_url" -o "$TEMP_FILE"

            # 计算当前 MD5
            CURRENT_HASH=$(md5sum "$TEMP_FILE" | awk '{print $1}')

            # 读取历史 MD5
            if [ -f "$HASH_FILE" ]; then
              LAST_HASH=$(cat "$HASH_FILE")
            else
              LAST_HASH=""
            fi

            # 判断是否有更新
            if [ "$CURRENT_HASH" != "$LAST_HASH" ]; then
              echo " -> 检测到更新！"
              HAS_UPDATES="true"
              
              # 保存新的 HASH
              echo "$CURRENT_HASH" > "$HASH_FILE"

              # 拼接分割线与更新内容到邮件正文中
              echo "<hr style='border: 2px dashed #007bff; margin: 30px 0;' />" >> $EMAIL_BODY_FILE
              echo "<h3>📌 来源地址: <a href='$raw_url'>$raw_url</a></h3>" >> $EMAIL_BODY_FILE
              echo "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 5px; overflow-x: auto;'>" >> $EMAIL_BODY_FILE
              echo "<pre style='white-space: pre-wrap; word-wrap: break-word;'>" >> $EMAIL_BODY_FILE
              # HTML 转义 & < > 防格式错乱
              sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' "$TEMP_FILE" >> $EMAIL_BODY_FILE
              echo "</pre>" >> $EMAIL_BODY_FILE
              echo "</div>" >> $EMAIL_BODY_FILE
            else
              echo " -> 内容未更新，跳过。"
            fi

            # 清理临时下载文件
            rm -f "$TEMP_FILE"
          done

          echo "</body></html>" >> $EMAIL_BODY_FILE

          # 输出环境变量给后续 Step 使用
          echo "HAS_UPDATES=$HAS_UPDATES" >> $GITHUB_OUTPUT

      # 3. 如果有任何一个地址更新，发送合并后的邮件
      - name: Send mail on updates
        if: steps.process_urls.outputs.HAS_UPDATES == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          
          subject: "【提醒】您监控的 GitHub README 有内容更新！"
          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions Monitor <${{ secrets.MAIL_USERNAME }}>
          
          html_body: file://data/email_body.html

      # 4. 自动 Commit Hash 变动及时间戳（保持仓库活跃防暂停）
      - name: Commit updated hashes and keepalive
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          echo "Last check: $(date)" > data/last_check.txt
          
          git add data/
          git commit -m "chore: auto update hashes & keepalive [skip ci]" || exit 0
          git push

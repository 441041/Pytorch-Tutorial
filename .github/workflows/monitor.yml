name: Monitor README Updates and Send Email

on:
  schedule:
    # 每天 UTC 时间 0:00（北京时间早上 8:00）运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 界面手动触发测试

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 获取目标仓库 README.md 内容并计算 MD5
      - name: Fetch Remote README
        id: fetch_readme
        run: |
          mkdir -p data
          # 获取目标 README.md 内容
          curl -sSL "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/README.md" -o data/latest_readme.md
          
          # 计算当前 MD5 值
          CURRENT_HASH=$(md5sum data/latest_readme.md | awk '{print $1}')
          echo "CURRENT_HASH=$CURRENT_HASH" >> $GITHUB_ENV
          
          # 读取旧的 HASH (如果存在)
          if [ -f data/last_hash.txt ]; then
            LAST_HASH=$(cat data/last_hash.txt)
          else
            LAST_HASH=""
          fi
          echo "LAST_HASH=$LAST_HASH" >> $GITHUB_ENV

      # 2. 对比哈希并标记状态
      - name: Compare Hash
        id: check_change
        run: |
          if [ "$CURRENT_HASH" != "$LAST_HASH" ]; then
            echo "CHANGED=true" >> $GITHUB_OUTPUT
            # 更新本地保存的 HASH
            echo "$CURRENT_HASH" > data/last_hash.txt
          else
            echo "CHANGED=false" >> $GITHUB_OUTPUT
            echo "README 没有更新，跳过发送邮件。"
          fi

      # 3. 如果内容有变动，发送邮件
      - name: Send mail on update
        if: steps.check_change.outputs.CHANGED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          # SMTP 服务器配置 (以 QQ 邮箱为例: smtp.qq.com, Gmail: smtp.gmail.com, 163: smtp.163.com)
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          
          subject: "【提醒】Pawdroid/Free-servers README 内容已更新！"
          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions Monitor <${{ secrets.MAIL_USERNAME }}>
          
          body: |
            你好！
            
            监控的目标项目 Pawdroid/Free-servers 的 README.md 文件有更新。
            
            项目地址：https://github.com/Pawdroid/Free-servers
            检查时间：$(date)
          
          # 可选：将最新的 README.md 作为附件发送，或取消注释直接把内容当作邮件正文
          # html_body: file://data/latest_readme.md

      # 4. 将最新的 Hash 提交回你的仓库，以便下一次对比
      - name: Commit updated hash
        if: steps.check_change.outputs.CHANGED == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/last_hash.txt
          git commit -m "chore: update last target hash [skip ci]" || exit 0
          git push

name: Monitor README Updates and Send Email

on:
  schedule:
    # 每天 UTC 时间 0:00（北京时间早上 8:00）运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 界面手动触发测试

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. 拉取当前仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 获取目标仓库 README.md 内容并计算当前 MD5
      - name: Fetch Remote README
        id: fetch_readme
        run: |
          mkdir -p data
          # 获取目标 README.md 内容
          curl -sSL "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/README.md" -o data/latest_readme.md
          
          # 计算当前 MD5 值
          CURRENT_HASH=$(md5sum data/latest_readme.md | awk '{print $1}')
          echo "CURRENT_HASH=$CURRENT_HASH" >> $GITHUB_ENV
          
          # 读取本地记录的旧 HASH (如果存在)
          if [ -f data/last_hash.txt ]; then
            LAST_HASH=$(cat data/last_hash.txt)
          else
            LAST_HASH=""
          fi
          echo "LAST_HASH=$LAST_HASH" >> $GITHUB_ENV

      # 3. 对比 Hash 判定内容是否有更新
      - name: Compare Hash
        id: check_change
        run: |
          if [ "$CURRENT_HASH" != "$LAST_HASH" ]; then
            echo "CHANGED=true" >> $GITHUB_OUTPUT
            # 保存最新的 HASH 到本地文件
            echo "$CURRENT_HASH" > data/last_hash.txt
          else
            echo "CHANGED=false" >> $GITHUB_OUTPUT
            echo "README 内容未发生变动，跳过发送邮件。"
          fi

      # 4. 如果发生变动，发送邮件提醒
      - name: Send mail on update
        if: steps.check_change.outputs.CHANGED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          
          subject: "【提醒】Pawdroid/Free-servers README 内容已更新！"
          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions Monitor <${{ secrets.MAIL_USERNAME }}>
          
          html_body: file://data/latest_readme.md

      # 5. 更新数据并提交（兼具更新记录与防 60 天暂停的功能）
      - name: Commit updated hash and keepalive
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 始终更新最后检查时间戳文件，确保仓库始终有 Commit 记录（原生防暂停）
          echo "Last check: $(date)" > data/last_check.txt
          
          git add data/
          # 如果有变更（无论是 hash 变更还是心跳时间戳变更）就提交推送
          git commit -m "chore: auto update status & keepalive [skip ci]" || exit 0
          git push
